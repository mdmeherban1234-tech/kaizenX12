<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070b">
<title>Street Bites · Scan. Order. Pickup.</title>
<style>
  *{box-sizing:border-box}
  :root{
    --amber:#ffb020; --orange:#ff7a1a; --neon:#5ef2c0;
    --txt:#f5f2ec; --muted:#a8a5b2; --stroke:rgba(255,255,255,.12);
    --glassbg:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.028));
    --r:20px;
    --grad:linear-gradient(180deg,#ffc247,#ff8a1f);
  }
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; min-height:100dvh; color:var(--txt);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; background:#07070b;
  }
  .orbs{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(900px 620px at 6% -10%, rgba(255,140,26,.34), transparent 62%),
      radial-gradient(720px 520px at 106% 8%, rgba(255,176,32,.20), transparent 60%),
      radial-gradient(760px 700px at 50% 112%, rgba(94,242,192,.11), transparent 62%),
      #07070b;
  }
  .wrap{position:relative; z-index:1; max-width:800px; margin:0 auto; padding:12px 12px 132px}
  .glass{
    background:var(--glassbg);
    border:1px solid var(--stroke);
    border-radius:var(--r);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    backdrop-filter:blur(18px) saturate(160%);
    box-shadow:0 12px 34px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.14);
  }
  /* ---------- header ---------- */
  .hdr{position:sticky; top:8px; z-index:30; padding:13px 14px; margin-bottom:12px}
  .hdr-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
  .shop{font-size:19px; font-weight:800; letter-spacing:.2px; line-height:1.15}
  .shop span{background:linear-gradient(92deg,#ffd479,#ff8a1f); -webkit-background-clip:text; background-clip:text; color:transparent}
  .tag{font-size:11.5px; color:var(--muted); margin-top:3px}
  .status{
    display:inline-flex; align-items:center; gap:6px; flex:0 0 auto;
    font-size:11px; font-weight:700; padding:6px 10px; border-radius:999px; white-space:nowrap;
  }
  .status.on{color:#0b1a12; background:linear-gradient(180deg,#8dffcd,#38d99a); box-shadow:0 0 18px rgba(94,242,192,.35)}
  .status.off{color:#ffd9d9; background:rgba(255,80,80,.16); border:1px solid rgba(255,90,90,.35)}
  .status .pulse{width:6px; height:6px; border-radius:50%; background:currentColor; animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1; transform:scale(1)}50%{opacity:.35; transform:scale(.7)}}
  .hdr-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:11px}
  .tinput{display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:7px 10px; flex:1; max-width:230px}
  .tinput span{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; font-weight:700}
  .tinput input{width:100%; background:none; border:0; color:var(--txt); font:inherit; font-size:14px; font-weight:600; outline:none; padding:0}
  .tinput select{width:100%; background:none; border:0; color:var(--txt); font:inherit; font-size:14px; font-weight:700; outline:none; padding:0; -webkit-appearance:none; appearance:none}
  .tinput select option{background:#16131a; color:#f5f2ec}
  .hdr-note{font-size:10.5px; color:var(--muted); text-align:right; line-height:1.35}
  /* ---------- tabs ---------- */
  .tabs{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; scrollbar-width:none; -ms-overflow-style:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05);
    color:var(--muted); font:inherit; font-size:12.5px; font-weight:650; padding:9px 14px;
    border-radius:999px; cursor:pointer; transition:.18s;
  }
  .tab.on{background:var(--grad); border-color:transparent; color:#22160a; box-shadow:0 6px 18px rgba(255,140,30,.34)}
  /* ---------- menu ---------- */
  .menu{display:grid; gap:11px; grid-template-columns:1fr}
  @media(min-width:660px){.menu{grid-template-columns:1fr 1fr}}
  .item{display:flex; padding:13px; gap:12px; position:relative; overflow:hidden}
  .item::after{content:""; position:absolute; inset:0; border-radius:var(--r); pointer-events:none; background:radial-gradient(120px 90px at 100% 0%, rgba(255,176,32,.12), transparent 70%)}
  .item-main{flex:1; min-width:0}
  .item-head{display:flex; align-items:center; gap:8px}
  .item-head h3{margin:0; font-size:15px; font-weight:700; letter-spacing:.1px}
  .veg-mark{width:14px; height:14px; border:2px solid #34d17a; border-radius:3px; display:grid; place-items:center; flex:0 0 auto}
  .veg-mark i{width:6px; height:6px; border-radius:50%; background:#34d17a; display:block}
  .nonveg .veg-mark{border-color:#ff5a5a}
  .nonveg .veg-mark i{background:#ff5a5a}
  .desc{margin:6px 0 11px; font-size:12.5px; color:var(--muted); line-height:1.45}
  .item-foot{display:flex; align-items:center; justify-content:space-between; gap:9px; flex-wrap:wrap}
  .seg{display:inline-flex; padding:3px; border-radius:12px; background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.09)}
  .seg button{border:0; background:none; color:var(--muted); font:inherit; font-size:11.5px; font-weight:700; padding:6px 10px; border-radius:9px; cursor:pointer; white-space:nowrap}
  .seg button.on{background:var(--grad); color:#22160a; box-shadow:0 4px 12px rgba(255,140,30,.32)}
  .price{font-size:15px; font-weight:800; color:#ffd479}
  .btn-add{
    border:0; cursor:pointer; font:inherit; font-size:12.5px; font-weight:800; letter-spacing:.4px;
    padding:9px 16px; border-radius:12px; color:#22160a; background:var(--grad);
    box-shadow:0 8px 20px rgba(255,140,30,.35); transition:transform .12s;
  }
  .btn-add:active{transform:scale(.95)}
  .btn-add:disabled{background:rgba(255,255,255,.1); color:var(--muted); box-shadow:none; cursor:not-allowed}
  .counter{display:inline-flex; align-items:center; gap:2px; background:var(--grad); border-radius:12px; padding:3px; box-shadow:0 8px 20px rgba(255,140,30,.3)}
  .counter button{width:30px; height:30px; border:0; background:rgba(0,0,0,.16); color:#22160a; border-radius:9px; font:inherit; font-size:17px; font-weight:800; cursor:pointer; line-height:1}
  .counter span{min-width:24px; text-align:center; font-size:13.5px; font-weight:800; color:#22160a}
  .item.out{opacity:.5}
  .item.out .item-foot{filter:grayscale(.4)}
  .empty{padding:26px 14px; text-align:center; color:var(--muted); font-size:13px}
  /* ---------- cart bar ---------- */
  .cartbar{
    position:fixed; left:10px; right:10px; bottom:10px; z-index:45;
    max-width:780px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:9px 10px 9px 16px; border-radius:18px; cursor:pointer;
    background:linear-gradient(160deg,rgba(38,28,16,.86),rgba(18,14,10,.86));
    border:1px solid rgba(255,176,32,.34);
    -webkit-backdrop-filter:blur(20px) saturate(170%); backdrop-filter:blur(20px) saturate(170%);
    box-shadow:0 16px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(255,176,32,.08), inset 0 1px 0 rgba(255,255,255,.16);
    animation:rise .25s ease-out;
  }
  @keyframes rise{from{transform:translateY(26px); opacity:0}to{transform:none; opacity:1}}
  .cartbar .cb-l{display:flex; flex-direction:column; line-height:1.25}
  .cartbar .cb-n{font-size:11px; color:var(--muted); font-weight:600}
  .cartbar .cb-t{font-size:16px; font-weight:800}
  .cartbar .cb-btn{background:var(--grad); color:#22160a; border:0; font:inherit; font-size:13px; font-weight:800; padding:11px 18px; border-radius:13px; box-shadow:0 8px 20px rgba(255,140,30,.4)}
  /* ---------- sheet ---------- */
  .sheet-wrap{position:fixed; inset:0; z-index:70; display:flex; align-items:flex-end; justify-content:center; background:rgba(0,0,0,.58); -webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px); animation:fade .18s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{
    width:100%; max-width:540px; max-height:90dvh; overflow-y:auto; overscroll-behavior:contain;
    border-radius:24px 24px 0 0; padding:8px 16px calc(18px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(30,25,20,.96),rgba(12,10,14,.98));
    border:1px solid rgba(255,255,255,.12); border-bottom:0;
    box-shadow:0 -20px 60px rgba(0,0,0,.7); animation:up .24s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  @media(min-width:560px){.sheet-wrap{align-items:center}.sheet{border-radius:24px; border-bottom:1px solid rgba(255,255,255,.12); max-height:86dvh}}
  .grab{width:42px; height:4px; border-radius:99px; background:rgba(255,255,255,.22); margin:6px auto 12px}
  .sheet h2{margin:0 0 2px; font-size:17px; font-weight:800}
  .sheet .sub{margin:0 0 14px; font-size:12px; color:var(--muted)}
  .line{display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px dashed rgba(255,255,255,.1)}
  .line:last-of-type{border-bottom:0}
  .line .lname{flex:1; min-width:0; font-size:13.5px; font-weight:650}
  .line .lvar{display:block; font-size:11px; color:var(--muted); font-weight:500; margin-top:2px}
  .line .lprice{font-size:13.5px; font-weight:800; white-space:nowrap; color:#ffd479}
  .counter.sm{background:rgba(255,255,255,.08); box-shadow:none; border:1px solid rgba(255,255,255,.12)}
  .counter.sm button{background:rgba(255,255,255,.1); color:var(--txt); width:26px; height:26px; font-size:15px}
  .counter.sm span{color:var(--txt); min-width:20px; font-size:12.5px}
  .field{margin-top:12px}
  .field label{display:block; font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); margin-bottom:6px}
  .field input, .field select, .field textarea{
    width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:var(--txt);
    border-radius:12px; padding:11px 12px; font:inherit; font-size:14px; outline:none;
  }
  .field input:focus, .field select:focus{border-color:rgba(255,176,32,.6); box-shadow:0 0 0 3px rgba(255,176,32,.14)}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .chips{display:flex; gap:8px; flex-wrap:wrap}
  .chip{
    flex:1; min-width:120px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.05);
    color:var(--muted); font:inherit; font-size:12.5px; font-weight:650; padding:11px 10px; border-radius:12px; cursor:pointer;
    display:flex; flex-direction:column; gap:2px; text-align:left;
  }
  .chip small{font-size:10.5px; font-weight:500; opacity:.8}
  .chip.on{background:linear-gradient(180deg,rgba(255,194,71,.22),rgba(255,138,31,.14)); border-color:rgba(255,176,32,.6); color:var(--txt)}
  .totals{margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,.12); font-size:13px; color:var(--muted)}
  .totals .row{display:flex; justify-content:space-between; margin-bottom:6px}
  .totals .grand{display:flex; justify-content:space-between; font-size:17px; font-weight:800; color:var(--txt); margin-top:8px}
  .btn-primary{
    width:100%; margin-top:14px; border:0; cursor:pointer; font:inherit; font-size:14.5px; font-weight:800;
    padding:15px; border-radius:14px; color:#22160a; background:var(--grad);
    box-shadow:0 12px 30px rgba(255,140,30,.4);
  }
  .btn-primary:active{transform:scale(.99)}
  .btn-ghost{
    width:100%; margin-top:9px; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05);
    color:var(--txt); font:inherit; font-size:13px; font-weight:650; padding:12px; border-radius:13px; cursor:pointer;
  }
  .upibox{margin-top:12px; padding:12px; border-radius:14px; background:rgba(255,255,255,.05); border:1px dashed rgba(255,176,32,.35); display:flex; gap:12px; align-items:center}
  .upibox canvas{width:104px; height:104px; border-radius:10px; background:#fff; flex:0 0 auto}
  .upibox img.payqr{width:104px; height:104px; object-fit:contain; border-radius:10px; background:#fff; padding:4px; flex:0 0 auto}
  .upibox div{font-size:11.5px; color:var(--muted); line-height:1.45}
  .upibox b{color:var(--txt); display:block; font-size:12.5px; margin-bottom:3px}
  /* ---------- track ---------- */
  .back{border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.05); color:var(--txt); font:inherit; font-size:12.5px; font-weight:650; padding:8px 13px; border-radius:11px; cursor:pointer; margin-bottom:12px}
  .ticket{padding:20px 16px; text-align:center; position:relative; overflow:hidden}
  .ticket::before{content:""; position:absolute; inset:-40% -20% auto; height:180px; background:radial-gradient(closest-side,rgba(255,176,32,.28),transparent); pointer-events:none}
  .tk-label{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); font-weight:700}
  .tk-no{font-size:38px; font-weight:900; letter-spacing:-.5px; margin:4px 0 2px; background:linear-gradient(92deg,#ffe0a3,#ff8a1f); -webkit-background-clip:text; background-clip:text; color:transparent}
  .tk-sub{font-size:12px; color:var(--muted)}
  .steps{list-style:none; display:flex; justify-content:space-between; gap:4px; margin:22px 0 6px; padding:0; position:relative}
  .steps::before{content:""; position:absolute; left:12%; right:12%; top:8px; height:2px; background:rgba(255,255,255,.13)}
  .steps li{flex:1; position:relative; font-size:10.5px; color:var(--muted); font-weight:650; padding-top:22px}
  .steps li .sdot{position:absolute; top:1px; left:50%; transform:translateX(-50%); width:15px; height:15px; border-radius:50%; background:#221d28; border:2px solid rgba(255,255,255,.2); z-index:1}
  .steps li.done .sdot{background:var(--grad); border-color:transparent; box-shadow:0 0 14px rgba(255,150,40,.6)}
  .steps li.active .sdot{background:#ffd479; border-color:#ffd479; animation:ring 1.7s ease-out infinite}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,212,121,.6)}100%{box-shadow:0 0 0 11px rgba(255,212,121,0)}}
  .steps li.done, .steps li.active{color:var(--txt)}
  .tk-items{text-align:left; margin-top:18px; border-top:1px solid rgba(255,255,255,.1); padding-top:12px}
  .tk-items .line{font-size:12.5px; padding:7px 0}
  .done-banner{margin-top:14px; padding:10px; border-radius:12px; font-size:12px; font-weight:700; background:rgba(94,242,192,.14); color:#8dffcd; border:1px solid rgba(94,242,192,.3)}
  /* ---------- admin ---------- */
  .adm-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 14px; margin-bottom:12px; position:sticky; top:8px; z-index:30}
  .adm-head h1{margin:0; font-size:16px; font-weight:800}
  .adm-head .who{font-size:11px; color:var(--muted); margin-top:2px}
  .pill{border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); color:var(--txt); font:inherit; font-size:11.5px; font-weight:700; padding:8px 12px; border-radius:10px; cursor:pointer}
  .atabs{display:flex; gap:6px; padding:5px; border-radius:14px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09); margin-bottom:12px}
  .atabs button{flex:1; border:0; background:none; color:var(--muted); font:inherit; font-size:12px; font-weight:700; padding:10px 4px; border-radius:10px; cursor:pointer}
  .atabs button.on{background:rgba(255,255,255,.12); color:var(--txt); box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
  .ord{padding:13px; margin-bottom:11px}
  .ord-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .tok{font-size:14.5px; font-weight:900; letter-spacing:.3px; color:#ffd479}
  .badge{font-size:10px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; padding:4px 8px; border-radius:7px}
  .st-pending .badge{background:rgba(255,90,90,.16); color:#ff9d9d}
  .st-preparing .badge{background:rgba(255,176,32,.16); color:#ffcf7a}
  .st-ready .badge{background:rgba(94,242,192,.16); color:#8dffcd}
  .st-completed .badge{background:rgba(255,255,255,.1); color:var(--muted)}
  .ago{margin-left:auto; font-size:10.5px; color:var(--muted)}
  .ord-who{font-size:12px; color:var(--muted); margin:7px 0 0}
  .ord-who b{color:var(--txt)}
  .ord-items{list-style:none; margin:9px 0 0; padding:9px 0 0; border-top:1px dashed rgba(255,255,255,.1)}
  .ord-items li{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:3px 0}
  .ord-items li span:last-child{color:#ffd479; font-weight:700; white-space:nowrap}
  .ord-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; padding-top:9px; border-top:1px solid rgba(255,255,255,.1)}
  .ord-total{font-size:14px; font-weight:800}
  .ord-total em{display:block; font-style:normal; font-size:10.5px; color:var(--muted); font-weight:500; margin-top:2px}
  .ord-actions{display:flex; gap:7px; flex-wrap:wrap; margin-top:11px}
  .act{border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.06); color:var(--txt); font:inherit; font-size:11.5px; font-weight:700; padding:9px 13px; border-radius:10px; cursor:pointer}
  .act.go{background:var(--grad); border-color:transparent; color:#22160a; box-shadow:0 6px 16px rgba(255,140,30,.3)}
  .act.ok{background:rgba(94,242,192,.16); border-color:rgba(94,242,192,.35); color:#8dffcd}
  .mrow{padding:11px; margin-bottom:9px; display:grid; gap:8px; grid-template-columns:1fr auto}
  .mrow .r1{display:flex; align-items:center; gap:8px}
  .mrow input[type=text], .mrow input[type=number], .mrow select{
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:var(--txt);
    border-radius:9px; padding:8px 9px; font:inherit; font-size:12.5px; outline:none; width:100%; min-width:0;
  }
  .mrow .name{font-weight:700}
  .mrow .rowp{display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:6px; align-items:center}
  .mrow .rowp small{font-size:10px; color:var(--muted); display:block; margin-bottom:3px; letter-spacing:.4px; text-transform:uppercase}
  .sw{position:relative; display:inline-block; vertical-align:middle; width:40px; height:23px; flex:0 0 auto}
  .sw input{position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer}
  .sw span{position:absolute; inset:0; border-radius:99px; background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.14); transition:.18s; pointer-events:none}
  .sw span::after{content:""; position:absolute; top:3px; left:3px; width:17px; height:17px; border-radius:50%; background:#fff; transition:.18s}
  .sw input:checked + span{background:linear-gradient(180deg,#8dffcd,#38d99a); border-color:transparent}
  .sw input:checked + span::after{transform:translateX(17px)}
  .del{border:1px solid rgba(255,90,90,.3); background:rgba(255,90,90,.12); color:#ff9d9d; font:inherit; font-size:12px; font-weight:700; width:34px; height:34px; border-radius:9px; cursor:pointer}
  .addform{padding:13px; margin-bottom:14px}
  .addform h3{margin:0 0 10px; font-size:13px; font-weight:800; letter-spacing:.2px}
  .qrbox{padding:16px; text-align:center}
  .qrbox canvas{width:220px; height:220px; border-radius:14px; background:#fff; padding:6px; box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .qr-actions{display:flex; gap:8px; margin-top:14px}
  .qr-actions button{flex:1}
  .qr-actions .uploadbtn{flex:1}
  .payqrbig{width:220px; height:220px; object-fit:contain; background:#fff; padding:6px; border-radius:14px; box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .uploadbtn{position:relative; overflow:hidden; display:inline-flex; align-items:center; justify-content:center; cursor:pointer}
  .uploadbtn input{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer}
  .note{font-size:11px; color:var(--muted); line-height:1.5; margin-top:10px; text-align:left}
  .kv{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:9px 0; border-bottom:1px dashed rgba(255,255,255,.1)}
  .kv:last-child{border:0}
  .kv span{color:var(--muted)}
  .pinbox{padding:22px 16px; text-align:center; max-width:340px; margin:60px auto}
  .pinbox h2{margin:0 0 4px; font-size:17px}
  .pinbox p{margin:0 0 16px; font-size:12px; color:var(--muted)}
  .pinbox input{width:100%; text-align:left; letter-spacing:.3px; font-size:15px; font-weight:600; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); color:var(--txt); border-radius:14px; padding:13px; outline:none}
  .pinbox input:focus{border-color:rgba(255,176,32,.6)}
  .err{color:#ff9d9d; font-size:11.5px; margin-top:8px; min-height:16px}
  /* ---------- misc ---------- */
  .foot{margin-top:22px; display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:10.5px; color:var(--muted); padding:0 4px}
  .foot button{border:0; background:none; color:var(--muted); font:inherit; font-size:10.5px; text-decoration:underline; cursor:pointer; padding:4px}
  .toast{
    position:fixed; left:50%; bottom:96px; transform:translate(-50%,14px); z-index:120;
    padding:11px 16px; border-radius:12px; font-size:12.5px; font-weight:650;
    background:rgba(24,20,16,.96); border:1px solid rgba(255,176,32,.4); color:var(--txt);
    box-shadow:0 14px 40px rgba(0,0,0,.6); opacity:0; pointer-events:none; transition:.22s; max-width:88vw; text-align:center;
  }
  .toast.on{opacity:1; transform:translate(-50%,0)}
  #printArea{display:none}
  @media print{
    .orbs,.wrap,.cartbar,.sheet-wrap,.toast{display:none !important}
    body{background:#fff}
    #printArea{display:block !important; color:#111}
    .poster{width:100%; text-align:center; padding:40px 20px; font-family:Georgia,serif}
    .poster .p-brand{font-size:44px; font-weight:900; letter-spacing:1px}
    .poster .p-tag{font-size:15px; color:#555; margin-top:6px}
    .poster img{width:340px; height:340px; margin:26px auto 10px; display:block}
    .poster .p-cta{font-size:32px; font-weight:800; letter-spacing:2px; margin-top:6px}
    .poster .p-steps{font-size:13px; color:#444; margin-top:12px}
    .poster .p-table{font-size:18px; margin-top:34px; letter-spacing:1px}
  }
</style>

<script>
/* ================= QR ENCODER (offline, byte mode, ECC-L, v1-v9) ================= */
/* ==== QR BEGIN ==== */
var QR=(function(){
  var EXP=new Array(512),LOG=new Array(256);
  (function(){var x=1;for(var i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&0x100)x^=0x11d;}for(var j=255;j<512;j++)EXP[j]=EXP[j-255];})();
  function mul(a,b){return (a===0||b===0)?0:EXP[LOG[a]+LOG[b]];}
  function genPoly(deg){var g=[1];for(var i=0;i<deg;i++){var ng=new Array(g.length+1).fill(0);for(var j=0;j<g.length;j++){ng[j]^=g[j];ng[j+1]^=mul(g[j],EXP[i]);}g=ng;}return g;}
  function rsRem(data,ecLen){var gen=genPoly(ecLen),res=new Array(ecLen).fill(0);
    for(var i=0;i<data.length;i++){var f=data[i]^res[0];res.shift();res.push(0);
      if(f!==0){for(var j=0;j<ecLen;j++)res[j]^=mul(gen[j+1],f);}}
    return res;}
  var VER={1:{d:19,e:7,b:1},2:{d:34,e:10,b:1},3:{d:55,e:15,b:1},4:{d:80,e:20,b:1},5:{d:108,e:26,b:1},6:{d:136,e:18,b:2},7:{d:156,e:20,b:2},8:{d:194,e:24,b:2},9:{d:232,e:30,b:2}};
  var ALIGN={1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34],7:[6,22,38],8:[6,24,42],9:[6,26,46]};
  function bchVersion(v){var d=v<<12;for(var i=17;i>=12;i--){if((d>>i)&1)d^=0x1F25<<(i-12);}return (v<<12)|d;}
  function bchFormat(data){var d=data<<10;for(var i=14;i>=10;i--){if((d>>i)&1)d^=0x537<<(i-10);}return ((data<<10)|d)^0x5412;}
  var MASKS=[
    function(r,c){return (r+c)%2===0;},
    function(r,c){return r%2===0;},
    function(r,c){return c%3===0;},
    function(r,c){return (r+c)%3===0;},
    function(r,c){return (Math.floor(r/2)+Math.floor(c/3))%2===0;},
    function(r,c){return ((r*c)%2+(r*c)%3)===0;},
    function(r,c){return (((r*c)%2+(r*c)%3)%2)===0;},
    function(r,c){return (((r+c)%2+(r*c)%3)%2)===0;}
  ];
  function penalty(m,size){
    var p=0,i,j;
    for(i=0;i<size;i++){
      var rr=1,cc=1;
      for(j=1;j<size;j++){
        if(m[i][j]===m[i][j-1])rr++;else{if(rr>=5)p+=3+(rr-5);rr=1;}
        if(m[j][i]===m[j-1][i])cc++;else{if(cc>=5)p+=3+(cc-5);cc=1;}
      }
      if(rr>=5)p+=3+(rr-5);
      if(cc>=5)p+=3+(cc-5);
    }
    for(i=0;i<size-1;i++)for(j=0;j<size-1;j++){
      var v=m[i][j];
      if(v===m[i][j+1]&&v===m[i+1][j]&&v===m[i+1][j+1])p+=3;
    }
    var pat=[1,0,1,1,1,0,1];
    function match(arr,start,step){for(var k=0;k<7;k++){if(arr[start+k*step]!==pat[k])return false;}return true;}
    for(i=0;i<size;i++){
      var row=m[i],col=[];
      for(j=0;j<size;j++)col.push(m[j][i]);
      for(j=0;j<=size-7;j++){
        if(match(row,j,1)){var b=true,a=true;
          for(var k=1;k<=4;k++){if(j-k<0||row[j-k]!==0)b=false;if(j+6+k>=size||row[j+6+k]!==0)a=false;}
          if(b||a)p+=40;}
        if(match(col,j,1)){var b2=true,a2=true;
          for(var k2=1;k2<=4;k2++){if(j-k2<0||col[j-k2]!==0)b2=false;if(j+6+k2>=size||col[j+6+k2]!==0)a2=false;}
          if(b2||a2)p+=40;}
      }
    }
    var dark=0;
    for(i=0;i<size;i++)for(j=0;j<size;j++)if(m[i][j])dark++;
    p+=Math.floor(Math.abs(dark/(size*size)*100-50)/5)*10;
    return p;
  }
  function encode(text){
    var bytes=Array.prototype.slice.call(new TextEncoder().encode(text));
    var version=0,v;
    for(v=1;v<=9;v++){if(bytes.length<=VER[v].d-2){version=v;break;}}
    if(!version)throw new Error('Link is too long for the built-in QR encoder (max 230 characters).');
    var bits=[];
    function push(val,len){for(var i=len-1;i>=0;i--)bits.push((val>>i)&1);}
    push(4,4); push(bytes.length,8);
    for(var i=0;i<bytes.length;i++)push(bytes[i],8);
    var cap=VER[version].d*8;
    for(i=0;i<4&&bits.length<cap;i++)bits.push(0);
    while(bits.length%8)bits.push(0);
    var dcw=[];
    for(i=0;i<bits.length;i+=8){var val=0;for(var j=0;j<8;j++)val=(val<<1)|bits[i+j];dcw.push(val);}
    var pad=[0xEC,0x11],pi=0;
    while(dcw.length<VER[version].d)dcw.push(pad[pi++%2]);
    var ecLen=VER[version].e,nb=VER[version].b,per=VER[version].d/nb;
    var dataBlocks=[],ecBlocks=[];
    for(i=0;i<nb;i++){var chunk=dcw.slice(i*per,(i+1)*per);dataBlocks.push(chunk);ecBlocks.push(rsRem(chunk,ecLen));}
    var cw=[];
    for(i=0;i<per;i++)for(var k=0;k<nb;k++)cw.push(dataBlocks[k][i]);
    for(i=0;i<ecLen;i++)for(k=0;k<nb;k++)cw.push(ecBlocks[k][i]);
    var size=version*4+17,m=[],fn=[];
    for(i=0;i<size;i++){m.push(new Array(size).fill(0));fn.push(new Array(size).fill(false));}
    function set(r,c,val){if(r<0||r>=size||c<0||c>=size)return;m[r][c]=val;fn[r][c]=true;}
    [[0,0],[0,size-7],[size-7,0]].forEach(function(pos){
      var r0=pos[0],c0=pos[1];
      for(var r=-1;r<=7;r++)for(var c=-1;c<=7;c++){
        var ring=(r>=0&&r<=6&&c>=0&&c<=6)&&(r===0||r===6||c===0||c===6||(r>=2&&r<=4&&c>=2&&c<=4));
        set(r0+r,c0+c,ring?1:0);
      }
    });
    for(i=8;i<size-8;i++){set(6,i,i%2===0?1:0);set(i,6,i%2===0?1:0);}
    var ctr=ALIGN[version],last=ctr[ctr.length-1];
    for(i=0;i<ctr.length;i++)for(var j2=0;j2<ctr.length;j2++){
      var ar=ctr[i],ac=ctr[j2];
      if((ar===6&&ac===6)||(ar===6&&ac===last)||(ar===last&&ac===6))continue;
      for(var dr=-2;dr<=2;dr++)for(var dc=-2;dc<=2;dc++){
        var dmax=Math.max(Math.abs(dr),Math.abs(dc));
        set(ar+dr,ac+dc,(dmax===0||dmax===2)?1:0);
      }
    }
    set(size-8,8,1);
    for(i=0;i<=8;i++){if(i!==6){if(!fn[8][i])set(8,i,0);if(!fn[i][8])set(i,8,0);}}
    for(i=0;i<8;i++){if(!fn[8][size-1-i])set(8,size-1-i,0);}
    for(i=0;i<7;i++){if(!fn[size-1-i][8])set(size-1-i,8,0);}
    if(version>=7){
      var vb=bchVersion(version);
      for(i=0;i<18;i++){var bit=(vb>>i)&1;set(Math.floor(i/3),size-11+(i%3),bit);set(size-11+(i%3),Math.floor(i/3),bit);}
    }
    var inc=-1,row=size-1,bitIdx=7,byteIdx=0;
    for(var col=size-1;col>0;col-=2){
      if(col===6)col-=1;
      while(true){
        for(k=0;k<2;k++){
          var cc=col-k;
          if(!fn[row][cc]){
            var dark=false;
            if(byteIdx<cw.length)dark=((cw[byteIdx]>>>bitIdx)&1)===1;
            m[row][cc]=dark?1:0;
            bitIdx--; if(bitIdx<0){bitIdx=7;byteIdx++;}
          }
        }
        row+=inc;
        if(row<0||row>=size){row-=inc;inc=-inc;break;}
      }
    }
    var cells=[];
    for(i=0;i<size;i++)for(var j3=0;j3<size;j3++)if(!fn[i][j3])cells.push([i,j3]);
    var best=0,bestScore=Infinity,bestM=null;
    for(var mk=0;mk<8;mk++){
      var t=[];
      for(i=0;i<size;i++)t.push(m[i].slice());
      for(var q=0;q<cells.length;q++){var cr=cells[q][0],cq=cells[q][1];if(MASKS[mk](cr,cq))t[cr][cq]^=1;}
      var sc=penalty(t,size);
      if(sc<bestScore){bestScore=sc;best=mk;bestM=t;}
    }
    var fin=bestM;
    var fb=bchFormat((1<<3)|best);
    for(i=0;i<15;i++){
      var b=(fb>>i)&1;
      if(i<6)fin[i][8]=b; else if(i<8)fin[i+1][8]=b; else fin[size-15+i][8]=b;
      if(i<8)fin[8][size-i-1]=b; else if(i<9)fin[8][15-i]=b; else fin[8][15-i-1]=b;
    }
    fin[size-8][8]=1;
    return {size:size,modules:fin,version:version,mask:best};
  }
  return {encode:encode};
})();
/* ==== QR END ==== */

function drawQR(canvas,text){
  var q=QR.encode(text),quiet=4,n=q.size+quiet*2;
  var px=Math.max(1,Math.floor(canvas.width/n));
  var off=Math.floor((canvas.width-px*n)/2);
  var ctx=canvas.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#0a0a10';
  for(var r=0;r<q.size;r++)for(var c=0;c<q.size;c++){
    if(q.modules[r][c])ctx.fillRect(off+(c+quiet)*px,off+(r+quiet)*px,px,px);
  }
  return q;
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(n){return '\u20B9'+Number(n).toLocaleString('en-IN');}
function uid(){return Math.random().toString(36).slice(2,9);}
function cartCount(){var t=0;S.cart.items.forEach(function(i){t+=i.qty;});return t;}
function cartTotal(){var t=0;S.cart.items.forEach(function(i){t+=i.qty*i.price;});return t;}
function lineQty(id,variant){
  var q=0;S.cart.items.forEach(function(i){if(i.id===id&&i.variant===variant)q+=i.qty;});return q;
}
function ago(ts){
  var m=Math.floor((Date.now()-ts)/60000);
  if(m<1)return 'just now';
  if(m<60)return m+' min ago';
  var h=Math.floor(m/60);
  return h+' hr ago';
}
function catLabel(id){for(var i=0;i<CATS.length;i++)if(CATS[i].id===id)return CATS[i].label;return id;}

var toastTimer=null;
function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.classList.remove('on');},2200);
}
function beep(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    var ctx=new AC(), o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.12,ctx.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.35);
    o.start(); o.stop(ctx.currentTime+.36);
  }catch(e){}
}

/* ================= RENDER ================= */
var prevView='shop';

function render(keepScroll){
  if(keepScroll===undefined)keepScroll=true;
  var y=window.scrollY;
  var act=document.activeElement;
  var fid=act&&act.id?act.id:null;
  var sel=null;
  try{if(fid&&act.selectionStart!=null)sel=act.selectionStart;}catch(e){}

  var app=document.getElementById('app');
  app.innerHTML = S.ui.view==='admin' ? adminView() : shopView();

  if(fid){
    var el=document.getElementById(fid);
    if(el){try{el.focus();if(sel!=null&&el.setSelectionRange)el.setSelectionRange(sel,sel);}catch(e){}}
  }
  if(keepScroll&&prevView===S.ui.view)window.scrollTo(0,y);
  else window.scrollTo(0,0);
  prevView=S.ui.view;

  // post-render canvases
  if(S.ui.view==='admin'&&S.ui.adminTab==='qr'){
    var cv=document.getElementById('qrcanvas');
    if(cv){
      try{drawQR(cv,qrPayload());}
      catch(e){cv.style.display='none'; toast(e.message);}
    }
    var pv=document.getElementById('payqrcanvas');
    if(pv){try{drawQR(pv,upiString(cartTotal()||100));}catch(e){}}
  }
  if(S.ui.view==='shop'&&S.ui.cartOpen&&S.cart.payment==='upi'){
    var uv=document.getElementById('upiqr');
    if(uv){
      try{drawQR(uv,upiString());}catch(e){}
    }
  }
}

function qrLink(){
  return (S.settings.orderLink||'').trim() || (location.href.split('#')[0]);
}
function qrPayload(){
  var base=qrLink();
  if(!S.ui.qrTable)return base;
  return base+(base.indexOf('?')>=0?'&':'?')+'table='+encodeURIComponent(S.ui.qrTable);
}
function upiString(amt){
  var s=S.settings;
  if(amt==null)amt=cartTotal();
  var pa=String(s.upi||'shop@upi').replace(/[^A-Za-z0-9.\-_@]/g,'');
  return 'upi://pay?pa='+pa+
    '&pn='+encodeURIComponent(s.payeeName||s.shopName)+'&am='+amt+'&cu=INR&tn='+encodeURIComponent('Order at '+s.shopName);
}

    ? '<div class="seg">'+
        '<button class="'+(sel==='half'?'on':'')+'" data-act="variant" data-id="'+it.id+'" data-v="half">Half '+money(it.half)+'</button>'+
        '<button class="'+(sel==='full'?'on':'')+'" data-act="variant" data-id="'+it.id+'" data-v="full">Full '+money(it.full)+'</button>'+
      '</div>'
    : '<div class="price">'+money(it.full)+'</div>';

  if(!it.stock){
    actHTML='<button class="btn-add" disabled>Out of stock</button>';
  }else if(qty>0){
    actHTML='<div class="counter">'+
      '<button data-act="dec" data-id="'+it.id+'" data-v="'+sel+'" aria-label="Remove one">&minus;</button>'+
      '<span>'+qty+'</span>'+

    '</div>';

    '<div class="item-main">'+
      '<div class="item-head"><span class="veg-mark"><i></i></span><h3>'+esc(it.name)+'</h3></div>'+
      '<p class="desc">'+esc(it.desc)+'</p>'+

    '</div>'+
  '</article>';
}

function findOrder(id){
  for(var i=0;i<S.orders.length;i++)if(S.orders[i].id===id)return S.orders[i];
  return null;
}

function stepsHTML(status){
  var STEPS=[['pending','Order placed'],['preparing','Preparing'],['ready','Ready for pickup']];
  var idx=status==='completed'?3:-1;
  for(var i=0;i<STEPS.length;i++)if(STEPS[i][0]===status)idx=i;
  return '<ol class="steps">'+STEPS.map(function(s,i){
    var cls=i<idx?'done':(i===idx?'active':'');
    return '<li class="'+cls+'"><span class="sdot"></span>'+s[1]+'</li>';
  }).join('')+'</ol>';
}

function ordersHTML(){
  if(!S.orders.length)return '<div class="empty glass" style="padding:34px 14px">No orders yet. Orders placed by customers will appear here live.</div>';
  var list=S.orders.slice().sort(function(a,b){
    var rank={pending:0,preparing:1,ready:2,completed:3};
    if(rank[a.status]!==rank[b.status])return rank[a.status]-rank[b.status];
    return b.createdAt-a.createdAt;
  });
  return list.map(orderCard).join('');
}

  var link=qrLink();

    ? '<img class="payqrbig" src="'+s.payQr+'" alt="Payment QR">'

  return '<div class="qrbox glass">'+

      '<canvas id="qrcanvas" width="512" height="512"></canvas>'+
      '<div class="qr-actions">'+
        '<button class="act" data-act="qrdl">Download PNG</button>'+
        '<button class="act go" data-act="qrprint">Print poster</button>'+
      '</div>'+
      '<div class="field" style="text-align:left"><label>Make a QR for</label>'+
        '<select id="qrTableSel" onchange="setQrTable(this.value)">'+tOpts+'</select></div>'+
      '<div class="field" style="text-align:left"><label>Ordering link inside the QR</label>'+
        '<input id="qrlink" value="'+esc(link)+'" oninput="setSetting(\'orderLink\',this.value)"></div>'+
      '<div class="note">Pick a table and the QR opens the menu with that table already selected. After you host this page (Netlify, Vercel or GitHub Pages — all free), paste that link here and print the poster again.</div>'+
    '</div>'+
    '<div class="qrbox glass" style="margin-top:12px">'+
      '<h2 style="margin:0 0 4px;font-size:15px">Payment QR (UPI)</h2>'+
      '<p class="sub" style="margin-bottom:14px">This is what the customer scans at checkout</p>'+
      payPreview+
      '<div class="qr-actions">'+
        '<label class="act uploadbtn">Upload new QR image<input type="file" accept="image/*" id="payQrFile" onchange="uploadPayQr(this)"></label>'+
        (s.payQr?'<button class="act" data-act="clearqr">Remove image</button>':'')+
      '</div>'+
      '<div class="field" style="text-align:left"><label>What to show at checkout</label>'+
        '<select id="payModeSel" onchange="setPayMode(this.value)">'+
          '<option value="image" '+(s.payMode==='image'?'selected':'')+'>My uploaded QR image (PhonePe / GPay)</option>'+
          '<option value="auto" '+(s.payMode==='auto'?'selected':'')+'>Auto QR with the exact bill amount (UPI ID)</option>'+
        '</select></div>'+
      '<div class="note">Your UPI ID: <b>'+esc(s.upi)+'</b> &middot; payee name <b>'+esc(s.payeeName||s.shopName)+'</b>. The auto option puts the bill amount into the QR, so the customer does not type it. The image option shows your own QR exactly as it is.</div>'+
    '</div>';
}

    '<h3 style="margin:0 0 12px;font-size:13px;letter-spacing:.2px">Shop</h3>'+

/* ================= ACTIONS ================= */
function setField(k,v){S.cart[k]=v;save();}
function setSetting(k,v){S.settings[k]=v;save();if(k==='open'||k==='orderLink')render();}
function setPayMode(v){S.settings.payMode=v;save();render();}
function setTables(v){
  var n=parseInt(v,10); if(isNaN(n)||n<0)n=0; if(n>60)n=60;
  S.settings.tables=n;
  if(S.cart.table&&Number(S.cart.table)>n)S.cart.table='';
  if(S.ui.qrTable&&Number(S.ui.qrTable)>n)S.ui.qrTable='';
  save(); render();
}
function tryPin(){
  var el=document.getElementById('pinInput');
  var v=el?el.value:'';
  if(v===String(S.settings.password)){S.ui.pinOk=true;S.ui.pinErr='';render(false);toast('Owner panel unlocked');}
  else{S.ui.pinErr='Wrong password. Try again.';render();}
}
function setQrTable(v){S.ui.qrTable=v;render();}
function uploadPayQr(input){
  var f=input.files&&input.files[0];
  if(!f){return;}
  var reader=new FileReader();
  reader.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=760, w=img.width, h=img.height;
      if(w>max||h>max){var k=Math.min(max/w,max/h); w=Math.round(w*k); h=Math.round(h*k);}
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      var cx=c.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,w,h); cx.drawImage(img,0,0,w,h);
      var url=c.toDataURL('image/jpeg',0.85);
      S.settings.payQr=url; S.settings.payMode='image';
      try{save();}catch(e){toast('Image too large to save — try a smaller one');return;}
      render(false); toast('Payment QR updated');
    };
    img.onerror=function(){toast('Could not read that image');};
    img.src=reader.result;
  };
  reader.onerror=function(){toast('Could not read that file');};
  reader.readAsDataURL(f);
}

function addLine(id,variant){
  var it=null;
  for(var i=0;i<S.menu.length;i++)if(S.menu[i].id===id)it=S.menu[i];
  if(!it||!it.stock)return;
  var price=variant==='half'?it.half:it.full;
  if(price==null)price=it.full;
  var found=null;
  S.cart.items.forEach(function(l){if(l.id===id&&l.variant===variant)found=l;});
  if(found)found.qty++;
  else S.cart.items.push({id:id,name:it.name,variant:variant,price:price,qty:1});
  save();render();
}
function decLine(id,variant){
  for(var i=0;i<S.cart.items.length;i++){
    var l=S.cart.items[i];
    if(l.id===id&&l.variant===variant){
      l.qty--;
      if(l.qty<=0)S.cart.items.splice(i,1);
      break;
    }
  }
  save();render();
}

function placeOrder(){
  if(!S.cart.items.length){toast('Your cart is empty');return;}
  var name=(S.cart.name||'').trim();
  var phone=(S.cart.phone||'').replace(/\D/g,'').slice(-10);
  if(name.length<2){toast('Please enter your name');return;}
  if(phone.length!==10){toast('Enter a valid 10-digit phone number');return;}
  var no=S.counter++;
  var order={
    id:uid(),no:no,token:'ORD-'+no,
    name:name,phone:phone,type:S.cart.type,payment:S.cart.payment,table:(S.cart.table||'').trim(),
    items:S.cart.items.map(function(l){return {id:l.id,name:l.name,variant:l.variant,price:l.price,qty:l.qty};}),
    total:cartTotal(),createdAt:Date.now(),status:'pending'
  };
  S.orders.unshift(order);
  S.cart={items:[],name:name,phone:S.cart.phone,type:S.cart.type,payment:S.cart.payment,table:S.cart.table};
  S.ui.track=order.id; S.ui.cartOpen=false;
  save();render(false);
  toast('Order placed · token #'+order.token);
}

function setStatus(id,status){
  for(var i=0;i<S.orders.length;i++)if(S.orders[i].id===id)S.orders[i].status=status;
  save();render();
}

function upd(id,key,val){
  for(var i=0;i<S.menu.length;i++){
    if(S.menu[i].id!==id)continue;
    var it=S.menu[i];
    if(key==='half'||key==='full'){
      var n=val===''?null:Number(val);
      it[key]=(n===null||isNaN(n))?null:n;
      if(key==='full'&&it.full==null)it.full=0;
    }else if(key==='stock'||key==='veg'){it[key]=!!val;}
    else it[key]=val;
    // keep existing cart lines in sync with new price
    S.cart.items.forEach(function(l){
      if(l.id===id){var p=l.variant==='half'?it.half:it.full; if(p!=null)l.price=p;}
    });
  }
  save();
}

function addItem(){
  var name=(document.getElementById('niName').value||'').trim();
  var fullRaw=document.getElementById('niFull').value;
  var halfRaw=document.getElementById('niHalf').value;
  var full=fullRaw===''?0:Number(fullRaw);
  var half=halfRaw===''?null:Number(halfRaw);
  if(name.length<2){toast('Enter an item name');return;}
  if(!full||full<=0){toast('Enter the full price');return;}
  S.menu.push({id:'x'+uid(),cat:document.getElementById('niCat').value,veg:document.getElementById('niVeg').checked,
    stock:true,name:name,desc:(document.getElementById('niDesc').value||'Fresh from the kitchen').trim(),
    half:half,full:full});
  save();render(false);toast('Item added to menu');
}

function delItem(id){
  S.menu=S.menu.filter(function(i){return i.id!==id;});
  S.cart.items=S.cart.items.filter(function(l){return l.id!==id;});
  save();render();toast('Item removed');
}

function waLink(o){
  var s=S.settings;
  var num=(s.whatsapp||'').replace(/\D/g,'');
  var lines=o?o.items.map(function(l){return l.qty+'x '+l.name+' ('+(l.variant==='half'?'Half':'Full')+')';}).join(', '):'';
  var txt=o
    ? 'Hi '+s.shopName+', I placed order #'+o.token+' for '+money(o.total)+'. Items: '+lines+'. Name: '+o.name+'.'
    : 'Hi '+s.shopName+', I want to order.';
  return 'https://wa.me/'+(num||'')+'?text='+encodeURIComponent(txt);
}

function printPoster(){
  var cv=document.getElementById('qrcanvas');
  if(!cv)return;
  var url=cv.toDataURL('image/png');
  var s=S.settings;
  document.getElementById('printArea').innerHTML=
    '<div class="poster">'+
      '<div class="p-brand">'+esc(s.shopName)+'</div>'+
      '<div class="p-tag">'+esc(s.tagline)+'</div>'+
      '<img src="'+url+'" alt="Ordering QR code">'+
      '<div class="p-cta">SCAN TO ORDER</div>'+
      '<div class="p-steps">1 &middot; Scan &nbsp;&nbsp; 2 &middot; Pick your food &nbsp;&nbsp; 3 &middot; Get your token &nbsp;&nbsp; 4 &middot; Pay at counter</div>'+
      '<div class="p-table">'+(S.ui.qrTable?('Table No. '+esc(S.ui.qrTable)):'Table No. ____________')+'</div>'+
    '</div>';
  window.print();
}

document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-act]'):null;
  if(!t)return;
  var act=t.getAttribute('data-act');
  var id=t.getAttribute('data-id');
  var v=t.getAttribute('data-v');
  if(act==='noop'){e.stopPropagation();return;}
  if(act==='cat'){S.ui.cat=t.getAttribute('data-cat');render();}
  else if(act==='variant'){S.ui.variant[id]=v;render();}
  else if(act==='add'){addLine(id,v);}
  else if(act==='inc'){addLine(id,v);}
  else if(act==='dec'){decLine(id,v);}
  else if(act==='openCart'){S.ui.cartOpen=true;render();}
  else if(act==='closeCart'){S.ui.cartOpen=false;render();}
  else if(act==='otype'){S.cart.type=t.getAttribute('data-t');save();render();}
  else if(act==='opay'){S.cart.payment=t.getAttribute('data-p');save();render();}
  else if(act==='place'){placeOrder();}
  else if(act==='back'){S.ui.view='shop';S.ui.track=null;S.ui.cartOpen=false;render(false);}
  else if(act==='admin'){S.ui.view='admin';render(false);}
  else if(act==='lock'){S.ui.pinOk=false;S.ui.view='shop';S.ui.adminTab='orders';render(false);toast('Owner panel locked');}
  else if(act==='trypin'){tryPin();}
  else if(act==='atab'){S.ui.adminTab=t.getAttribute('data-t');render(false);}
  else if(act==='status'){setStatus(id,t.getAttribute('data-s'));}
  else if(act==='del'){delItem(id);}
  else if(act==='additem'){addItem();}
  else if(act==='qrdl'){
    var cv=document.getElementById('qrcanvas');
    if(cv){var a=document.createElement('a');a.href=cv.toDataURL('image/png');
      a.download=(S.ui.qrTable?('table-'+S.ui.qrTable+'-qr.png'):'ordering-qr.png');a.click();toast('QR downloaded');}
  }
  else if(act==='qrprint'){printPoster();}
  else if(act==='clearqr'){
    S.settings.payQr=''; S.settings.payMode='auto'; save(); render(false); toast('Payment image removed — using auto UPI QR');
  }
  else if(act==='reset'){
    if(confirm('Reset all orders and menu to demo defaults?')){
      var keepPass=S.settings.password, keepQr=S.settings.payQr, keepMode=S.settings.payMode;
      S=freshState();
      S.settings.password=keepPass; S.settings.payQr=keepQr; S.settings.payMode=keepMode;
      S.ui.pinOk=true;S.ui.view='admin';
      save();render(false);toast('Orders and menu reset to demo defaults');
    }
  }
  else if(act==='wa'){
    var o=id?findOrder(id):null;
    window.open(waLink(o),'_blank');
  }
});

/* live sync between tabs (customer phone tab + owner tablet tab) */
setInterval(function(){
  var raw=localStorage.getItem(LS_KEY);
  if(!raw||raw===lastRaw)return;
  lastRaw=raw;
  var before={};
  S.orders.forEach(function(o){before[o.id]=o.status;});
  var next=load();
  var newOnes=next.orders.filter(function(o){return !before[o.id];});
  var changed=false;
  next.orders.forEach(function(o){if(before[o.id]&&before[o.id]!==o.status)changed=true;});
  S.orders=next.orders; S.menu=next.menu; S.settings=next.settings; S.counter=next.counter;
  if(newOnes.length&&S.ui.view==='admin'&&S.ui.pinOk){beep();toast('New order #'+newOnes[0].token);}
  else if(changed&&S.ui.track){toast('Order status updated');}
  render();
},1500);

/* boot */
S=load();
(function(){
  try{
    var q=new URLSearchParams(location.search||'');
    var tb=q.get('table');
    if(tb){S.cart.table=String(tb).slice(0,3);S.cart.type='dine';}
  }catch(e){}
})();
render(false);
</script>
